# Tool configuration only.
#
# There is deliberately no [project] or [build-system] table. The backend is
# never installed as a distribution: it is run from this directory, and
# dependencies come from requirements.txt. Declaring one made Vercel's Python
# builder treat backend/ as an installable package and try to build a wheel for
# it, which failed and took the whole deployment with it.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
