; Pytest configuration.
;
; Deliberately not in pyproject.toml: Vercel's Python builder treats any
; pyproject.toml it finds as a uv project and runs `uv lock` against it, which
; fails and takes the deployment with it. The backend is never installed as a
; distribution, so it has no reason to carry packaging metadata.
[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings = ignore::DeprecationWarning
